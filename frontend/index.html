<!doctype html>
<html lang="en-IN" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Favicons cropped from the company's own logo emblem — the wordmark
         lockup is 4:1 and unreadable at icon sizes. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071518" media="(prefers-color-scheme: dark)" />
    <title>Vedanjay Power | Renewable Energy &amp; Power Management</title>

    <!-- Theme is resolved and applied BEFORE first paint, so the page never
         flashes the wrong theme. Stored choice wins; otherwise follow the OS. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vp-theme');
          var theme = stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.setAttribute('data-bs-theme', theme);
          root.style.colorScheme = theme;
          // Suppress transitions for the first frames so boot is instant, not a fade.
          root.classList.add('vp-theme-booting');
          window.addEventListener('DOMContentLoaded', function () {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                root.classList.remove('vp-theme-booting');
              });
            });
          });
        } catch (e) { /* private mode / storage disabled — light is the default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
